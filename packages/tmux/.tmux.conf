# Truecolor inside tmux: tmux-256color advertises proper terminfo, and the
# *256col* override enables RGB so OpenCode/Neovim/etc. don't get downsampled
# to the 256-color palette (which produces visible halos on saturated tokens).
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",*256col*:RGB"

# reload tmux config
bind r source-file ~/.tmux.conf \; display "Reloaded tmux.conf!"

# rebind prefix to Ctrl + A
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# ── Aura theme (matches OpenCode) ──
# Base colors
aura_bg="#0f0f0f"
aura_bg_panel="#15141b"
aura_fg="#edecee"
aura_fg_muted="#6d6d6d"
aura_border="#2d2d2d"
aura_purple="#a277ff"
aura_pink="#f694ff"
aura_blue="#82e2ff"
aura_red="#ff6767"
aura_orange="#ffca85"
aura_cyan="#61ffca"
aura_green="#9dff65"

# Status bar
set-option -g status-style "bg=${aura_bg},fg=${aura_fg_muted}"
set-option -g status-left ""
set-option -g status-left-length 30
set-option -g status-right-length 120

# Status modules (right to left)
# Refresh intervals: weather 30m (cached), cpu/mem 1s, uptime 1s, now playing 1s, timer 1s
set-option -g status-right "\
#[fg=${aura_cyan}]#(~/.config/tmux/scripts/weather.sh)\
#[fg=${aura_fg_muted}] │ \
#[fg=${aura_green}]#(~/.config/tmux/scripts/cpu_mem.sh)\
#[fg=${aura_fg_muted}] │ \
#[fg=${aura_orange}]#(~/.config/tmux/scripts/uptime.sh)\
#[fg=${aura_fg_muted}] │ \
#[fg=${aura_pink}]#(~/.config/tmux/scripts/now_playing.sh)\
#[fg=${aura_fg_muted}] │ \
#[fg=${aura_purple}]#(~/.config/tmux/scripts/timer.sh)\
#[fg=${aura_fg_muted}] │ \
#[fg=${aura_cyan}]%I:%M %p "

# Auto-refresh status bar
set-option -g status-interval 1

# Window status
set-window-option -g window-status-format "#[fg=${aura_fg_muted}] #I:#W "
set-window-option -g window-status-current-format "#[fg=${aura_bg},bg=${aura_purple},bold] #I:#W #[default]"
set-window-option -g window-status-separator ""

# Pane border
set-option -g pane-border-style "fg=${aura_border}"
set-option -g pane-active-border-style "fg=${aura_purple}"

# Message
set-option -g message-style "fg=${aura_bg},bg=${aura_purple}"
set-option -g message-command-style "fg=${aura_bg},bg=${aura_pink}"

# Mode
set-window-option -g mode-style "fg=${aura_bg},bg=${aura_purple}"

# Clock
set-window-option -g clock-mode-colour "${aura_purple}"

# start windows indexing from 1
set -g base-index 1

# kill pane without confirmation
bind-key x kill-pane

# don't notify if other windows have activities
setw -g monitor-activity off

# renumber windows on window close
set -g renumber-windows on

# split panes using | and -
bind - split-window -h
bind | split-window -v
unbind '"'
unbind %

# vim-like pane switching
set-window-option -g mode-keys vi
bind -r ^ last-window
bind -r k select-pane -U
bind -r j select-pane -D
bind -r h select-pane -L
bind -r l select-pane -R

### Plugins ###

# initialize tmux plugin manager
set -g @plugin 'tmux-plugins/tpm'
# set -g @catppuccin_flavour 'mocha' # or frappe, macchiato, mocha

set -g @catppuccin_window_left_separator "█"
set -g @catppuccin_window_right_separator "█ "
set -g @catppuccin_window_number_position "right"
set -g @catppuccin_window_middle_separator "  █"

set -g @catppuccin_window_default_fill "number"
set -g @catppuccin_window_default_text "#W"

set -g @catppuccin_window_current_fill "number"
set -g @catppuccin_window_current_text "#W"

set -g @catppuccin_status_modules_right "W"
set -g @catppuccin_status_left_separator  ""
set -g @catppuccin_status_right_separator " "
set -g @catppuccin_status_right_separator_inverse "yes"
set -g @catppuccin_status_fill "all"
set -g @catppuccin_status_connect_separator "no"

# sensible rebinds
set -g @plugin 'tmux-plugins/tmux-sensible'

# catppuccin status line
# set -g @plugin 'catppuccin/tmux'

# rose-pine status line
# set -g @plugin 'rose-pine/tmux'
# set -g @rose_pine_variant 'main' # options are 'main', 'moon' or 'dawn'

# resurrect session after reboot
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-nvim 'session'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'off'

set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-prefix-highlight'

# tiling window manager like binds
set -g @plugin 'jabirali/tmux-tilish'
set -g @tilish-default 'main-vertical'

# Pomodoro: prefix+T = 25min focus (or reset if running), prefix+B = 5min break, prefix+S = stop
bind T run "if [ -f /tmp/.tmux_timer ]; then rm -f /tmp/.tmux_timer; tmux display '⏱ Reset'; else end=$(( $(date +%s) + 1500 )); echo \"\${end}:focus\" > /tmp/.tmux_timer; tmux display '🔥 Focus 25min'; fi"
bind B run "end=$(( $(date +%s) + 300 )); echo \"\${end}:break\" > /tmp/.tmux_timer; tmux display '☕ Break 5min'"
bind S run "rm -f /tmp/.tmux_timer; tmux display '⏱ Stopped'"

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run -b '~/.tmux/plugins/tpm/tpm'
