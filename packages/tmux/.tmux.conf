# Truecolor inside tmux: tmux-256color advertises proper terminfo, and the
# *256col* override enables RGB so OpenCode/Neovim/etc. don't get downsampled
# to the 256-color palette (which produces visible halos on saturated tokens).
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",*256col*:RGB"

# reload tmux config
bind r source-file ~/.tmux.conf \; display "Reloaded tmux.conf!"

# rebind prefix to Ctrl + A
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# Auto-refresh status bar
set-option -g status-interval 1

# start windows indexing from 1
set -g base-index 1

# kill pane without confirmation
bind-key x kill-pane

# don't notify if other windows have activities
setw -g monitor-activity off

# renumber windows on window close
set -g renumber-windows on

# split panes using | and -
bind - split-window -h
bind | split-window -v
unbind '"'
unbind %

# vim-like pane switching
set-window-option -g mode-keys vi
bind -r ^ last-window
bind -r k select-pane -U
bind -r j select-pane -D
bind -r h select-pane -L
bind -r l select-pane -R

### Plugins ###

# initialize tmux plugin manager
set -g @plugin 'tmux-plugins/tpm'

# sensible rebinds
set -g @plugin 'tmux-plugins/tmux-sensible'

# rose-pine status line
# set -g @plugin 'rose-pine/tmux'
# set -g @rose_pine_variant 'main' # options are 'main', 'moon' or 'dawn'

# resurrect session after reboot
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-nvim 'session'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'off'

set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-prefix-highlight'

# tiling window manager like binds
set -g @plugin 'jabirali/tmux-tilish'
set -g @tilish-default 'main-vertical'

# Theme-specific colors/status/plugin declarations live in one of:
#   tmux-catppuccin -> ~/.config/tmux/theme.conf
#   tmux-onedark   -> ~/.config/tmux/theme.conf
# Keep this before TPM initialization so theme plugins are installed.
if-shell "test -f ~/.config/tmux/theme.conf" "source-file ~/.config/tmux/theme.conf"

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run -b '~/.tmux/plugins/tpm/tpm'
