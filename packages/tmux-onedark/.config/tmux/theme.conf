# OneDark tmux theme package.

# Base colors
onedark_bg="#282c34"
onedark_bg_panel="#3e4451"
onedark_fg="#abb2bf"
onedark_fg_muted="#5c6370"
onedark_border="#3e4451"
onedark_purple="#c678dd"
onedark_pink="#e06c75"
onedark_blue="#61afef"
onedark_red="#e06c75"
onedark_orange="#d19a66"
onedark_teal="#56b6c2"
onedark_green="#98c379"

# Status bar
set-option -g status-style "bg=${onedark_bg},fg=${onedark_fg_muted}"
set-option -g status-left ""
set-option -g status-left-length 30
set-option -g status-right-length 120

# Status modules (right to left)
# Refresh intervals: weather 30m (cached), cpu/mem 1s, now playing 1s
set-option -g status-right "#[fg=${onedark_teal}]#(~/.config/tmux/scripts/weather.sh)#[fg=${onedark_fg_muted}] │ #[fg=${onedark_green}]#(~/.config/tmux/scripts/cpu_mem.sh)#[fg=${onedark_fg_muted}] │ #[fg=${onedark_purple}]#(~/.config/tmux/scripts/now_playing.sh)#[fg=${onedark_fg_muted}] │ #[fg=${onedark_blue}] %H:%M "

# Window status
set-window-option -g window-status-format "#[fg=${onedark_fg_muted}] #I:#W "
set-window-option -g window-status-current-format "#[fg=${onedark_bg},bg=${onedark_blue},bold] #I:#W #[default]"
set-window-option -g window-status-separator ""

# Pane border
set-option -g pane-border-style "fg=${onedark_border}"
set-option -g pane-active-border-style "fg=${onedark_blue}"

# Message
set-option -g message-style "fg=${onedark_bg},bg=${onedark_blue}"
set-option -g message-command-style "fg=${onedark_bg},bg=${onedark_purple}"

# Mode
set-window-option -g mode-style "fg=${onedark_bg},bg=${onedark_blue}"

# Clock
set-window-option -g clock-mode-colour "${onedark_blue}"
