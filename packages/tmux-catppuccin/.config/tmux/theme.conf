# Catppuccin Mocha tmux theme package.

# Base colors
catppuccin_bg="#1e1e2e"
catppuccin_bg_panel="#313244"
catppuccin_fg="#cdd6f4"
catppuccin_fg_muted="#a6adc8"
catppuccin_border="#45475a"
catppuccin_mauve="#cba6f7"
catppuccin_pink="#f5c2e7"
catppuccin_blue="#89b4fa"
catppuccin_red="#f38ba8"
catppuccin_peach="#fab387"
catppuccin_teal="#94e2d5"
catppuccin_green="#a6e3a1"

# Status bar
set-option -g status-style "bg=${catppuccin_bg},fg=${catppuccin_fg_muted}"
set-option -g status-left ""
set-option -g status-left-length 30
set-option -g status-right-length 120

# Status modules (right to left)
# Refresh intervals: weather 30m (cached), cpu/mem 1s, now playing 1s
set-option -g status-right "#[fg=${catppuccin_teal}]#(~/.config/tmux/scripts/weather.sh)#[fg=${catppuccin_fg_muted}] │ #[fg=${catppuccin_green}]#(~/.config/tmux/scripts/cpu_mem.sh)#[fg=${catppuccin_fg_muted}] │ #[fg=${catppuccin_pink}]#(~/.config/tmux/scripts/now_playing.sh)#[fg=${catppuccin_fg_muted}] │ #[fg=${catppuccin_blue}] %H:%M "

# Window status
set-window-option -g window-status-format "#[fg=${catppuccin_fg_muted}] #I:#W "
set-window-option -g window-status-current-format "#[fg=${catppuccin_bg},bg=${catppuccin_mauve},bold] #I:#W #[default]"
set-window-option -g window-status-separator ""

# Pane border
set-option -g pane-border-style "fg=${catppuccin_border}"
set-option -g pane-active-border-style "fg=${catppuccin_mauve}"

# Message
set-option -g message-style "fg=${catppuccin_bg},bg=${catppuccin_mauve}"
set-option -g message-command-style "fg=${catppuccin_bg},bg=${catppuccin_pink}"

# Mode
set-window-option -g mode-style "fg=${catppuccin_bg},bg=${catppuccin_mauve}"

# Clock
set-window-option -g clock-mode-colour "${catppuccin_mauve}"

# Catppuccin tmux plugin
set -g @catppuccin_flavour 'mocha'
set -g @catppuccin_window_left_separator "█"
set -g @catppuccin_window_right_separator "█ "
set -g @catppuccin_window_number_position "right"
set -g @catppuccin_window_middle_separator "  █"
set -g @catppuccin_window_default_fill "number"
set -g @catppuccin_window_default_text "#W"
set -g @catppuccin_window_current_fill "number"
set -g @catppuccin_window_current_text "#W"
set -g @catppuccin_status_modules_right "W"
set -g @catppuccin_status_left_separator  ""
set -g @catppuccin_status_right_separator " "
set -g @catppuccin_status_right_separator_inverse "yes"
set -g @catppuccin_status_fill "all"
set -g @catppuccin_status_connect_separator "no"
set -g @plugin 'catppuccin/tmux'
